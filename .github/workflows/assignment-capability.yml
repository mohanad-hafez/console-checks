name: Assignment capability
on:
  push:
    branches: [replacement-assignment-probe-01]
    paths: [.github/assignment-probe-ready]
permissions:
  contents: read
concurrency:
  group: assignment-probe
  cancel-in-progress: false
jobs:
  check:
    if: github.repository == 'mohanad-hafez/console-checks'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check assignment availability
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECK_ISSUE: '1'
        run: node .github/scripts/assignment-probe.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: assignment-capability
          path: assignment-probe.json
          retention-days: 7
